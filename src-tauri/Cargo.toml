[package]
name = "whisperaround"
version = "0.1.6"
description = "Superwhisper but open sourced — instant voice dictation via OpenAI Whisper."
authors = ["WhisperAround"]
edition = "2021"

# The library that the binary entrypoint (`main.rs`) calls into. Keeping the app
# logic in a lib lets it be reused (e.g. for mobile entry points / tests).
[lib]
name = "whisperaround_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Native microphone capture + WAV encoding.
cpal = "0.15"
hound = "3.5"

# Keyboard simulation for the auto-paste (Ctrl/Cmd+V).
enigo = "0.2"

# HTTPS client for the OpenAI Whisper endpoint (rustls to avoid a system OpenSSL
# dependency on the multipart upload path).
reqwest = { version = "0.12", default-features = false, features = [
  "multipart",
  "json",
  "rustls-tls",
] }
tauri-plugin-updater = { version = "2.9", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Atomic move+resize of the floating window (avoids a one-frame jump), the
# low-level input hooks behind single-key / mouse shortcuts and the
# foreground app name for the history.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# Windows build number (Mica needs Windows 11).
windows-version = "0.1"
# Launching the app again while it runs opens the settings window instead of
# starting a second copy (macOS does this natively).
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# Privacy permission checks (Accessibility / Microphone) and window tweaks.
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[profile.release]
# Optimize for a small binary to hit the < 20 MB target.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
